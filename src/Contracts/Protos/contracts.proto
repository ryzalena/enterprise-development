syntax = "proto3";

option csharp_namespace = "Contracts.Protos";

package contracts;

// Сервис для потоковой передачи контрактов
service ContractStreaming {
  rpc StreamContracts (stream ContractRequest) returns (stream ContractResponse);
}

// Запрос на отправку контракта
message ContractRequest {
  string generator_id = 1;
  Contract contract = 2;
}

// Ответ сервера
message ContractResponse {
  string contract_id = 1;
  bool success = 2;
  string message = 3;
}

// Модель контракта для поликлиники
message Contract {
  string id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  string service_type = 4;
  double price = 5;
  string status = 6;
  string created_date = 7;
  string valid_until = 8;
  string appointment_id = 9;
  string diagnosis = 10;
  repeated string prescribed_medications = 11;
  string treatment_plan = 12;
}